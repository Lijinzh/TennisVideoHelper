name: 用户意见反馈
description: 报告使用问题、识别效果、安装问题或功能建议
title: "[反馈] "
labels: ["user feedback"]
body:
  - type: dropdown
    id: category
    attributes:
      label: 反馈类型
      options:
        - 使用问题
        - 识别效果
        - 安装或更新
        - 功能建议
        - 其他反馈
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 问题或建议
      description: 请说明发生了什么、你期待的结果，以及可以复现问题的步骤。
      placeholder: 请尽量具体地描述你的体验。
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 使用环境
      description: 当前只发布 Windows 10 / 11 x64 版本。
      options:
        - Windows 11 x64
        - Windows 10 x64
        - Windows 版本不确定
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: 显卡信息
      description: 请填写显卡型号和显存（如果知道）。
      placeholder: NVIDIA RTX 3070 8GB

  - type: input
    id: video_spec
    attributes:
      label: 视频规格
      description: 可选填写分辨率、帧率和容器格式。
      placeholder: 4K / 60fps / MOV

  - type: checkboxes
    id: privacy
    attributes:
      label: 公开信息确认
      options:
        - label: 我已移除手机号、邮箱、私人视频链接等敏感信息。
          required: true
