[project]
name = "tennis-video-helper"
version = "0.1.3"
description = "使用音画融合自动筛选网球长回合并切分视频。"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.11",
    "pyside6>=6.11.1",
    "soundfile>=0.13",
    "torch>=2.7",
    "torchvision>=0.22",
    "typer>=0.16",
    "ultralytics>=8.3",
]

[project.scripts]
tennis-video-helper = "tennis_video_helper.app.cli:app"
tennis-video-helper-gui = "tennis_video_helper.ui.main_window:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
]
gpu-max = [
    "nvidia-modelopt[onnx]>=0.44",
    "onnx>=1.12,<2",
    "onnxruntime-gpu==1.22.0 ; sys_platform == 'win32'",
    "onnxslim>=0.1.82",
    "pynvvideocodec>=2.1",
    "tensorrt-cu12!=10.2.0,>=10.13",
    "tensorrt-cu12-libs==11.1.0.106",
]
package = [
    "pyinstaller>=6.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tennis_video_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.sources]
torchvision = { index = "pytorch-cu128" }
torch = { index = "pytorch-cu128" }
nvidia-modelopt = { index = "nvidia" }
tensorrt-cu12-libs = { index = "nvidia" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.cn/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
