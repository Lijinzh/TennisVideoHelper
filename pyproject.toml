[project]
name = "tennis-video-helper"
version = "0.1.0"
description = "使用音画融合自动筛选网球长回合并切分视频。"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "librosa>=0.11",
    "numpy>=2.0",
    "opencv-python>=4.11",
    "pyside6>=6.11.1",
    "scipy>=1.15",
    "soundfile>=0.13",
    "torch>=2.7",
    "torchvision>=0.22",
    "typer>=0.16",
    "ultralytics>=8.3",
]

[project.scripts]
tennis-video-helper = "tennis_video_helper.cli:app"
tennis-video-helper-gui = "tennis_video_helper.gui:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tennis_video_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.sources]
torchvision = { index = "pytorch-cu128" }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
