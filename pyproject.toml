[project]
name = "tennis-video-helper"
version = "0.1.0"
description = "使用音画融合自动筛选网球长回合并切分视频。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "typer>=0.16",
]

[project.scripts]
tennis-video-helper = "tennis_video_helper.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tennis_video_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

